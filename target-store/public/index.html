<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PixelMart — Hardware &amp; Dev Gear</title>
  <style>
    :root {
      --bg: #fafaf9;
      --surface: #ffffff;
      --subtle: #f5f5f4;
      --border: #e5e5e2;
      --border-strong: #d4d4cf;
      --ink: #111111;
      --ink-2: #52524e;
      --ink-3: #8a8a85;
      --ok: #15803d;
      --ok-bg: #f0fdf4;
      --ok-border: #bbf7d0;
      --danger: #b91c1c;
      --danger-bg: #fef2f2;
      --danger-border: #fecaca;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--ink);
      padding: 20px;
      line-height: 1.45;
      font-size: 13.5px;
      -webkit-font-smoothing: antialiased;
    }
    .shell { max-width: 1100px; margin: 0 auto; display: grid; gap: 16px; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 18px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; letter-spacing: -0.02em; }
    .brand-dot {
      width: 9px; height: 9px; border-radius: 2px;
      background: var(--ink);
    }
    .auth-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .badge {
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11.5px;
      font-family: var(--mono);
      background: var(--subtle);
      border: 1px solid var(--border);
      color: var(--ink-2);
    }
    .badge.live { color: var(--ink); }
    button {
      cursor: pointer;
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--ink);
      padding: 6px 11px;
      border-radius: 5px;
      font-size: 12.5px;
      font-weight: 500;
      transition: background 0.12s ease;
    }
    button:hover { background: var(--subtle); }
    button.primary { background: var(--ink); border-color: var(--ink); color: #ffffff; }
    button.primary:hover { background: #262626; }
    input {
      background: var(--surface);
      border: 1px solid var(--border-strong);
      color: var(--ink);
      padding: 6px 10px;
      border-radius: 5px;
      font-size: 12.5px;
      font-family: var(--mono);
    }
    .grid {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 16px;
      align-items: start;
    }
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 18px;
    }
    .panel h2 {
      font-size: 11.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--ink-3);
      margin-bottom: 12px;
    }
    .products { display: grid; border-top: 1px solid var(--border); }
    .product-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      padding: 11px 0;
    }
    .product-name { font-weight: 500; font-size: 14px; color: var(--ink); }
    .product-sku { font-size: 11.5px; color: var(--ink-3); font-family: var(--mono); }
    .product-price { font-weight: 600; font-size: 14px; font-family: var(--mono); color: var(--ink); margin-right: 10px; }
    .cart-list { display: grid; gap: 6px; margin-bottom: 12px; font-size: 13px; }
    .cart-item {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 5px; padding: 8px 10px;
    }
    .coupon-row { display: flex; gap: 8px; margin-bottom: 10px; }
    .coupon-row input { flex: 1; }
    .totals {
      border-top: 1px solid var(--border);
      padding-top: 10px;
      margin-bottom: 12px;
      display: grid;
      gap: 4px;
      font-size: 13px;
    }
    .total-line { display: flex; justify-content: space-between; color: var(--ink-2); }
    .total-final { font-size: 16px; font-weight: 600; font-family: var(--mono); color: var(--ink); margin-top: 4px; }
    .banner {
      display: none;
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 6px;
      font-size: 12.5px;
      font-weight: 600;
      border: 1px solid transparent;
    }
    .banner.show { display: block; }
    .banner.breach {
      background: var(--danger-bg);
      border-color: var(--danger-border);
      color: var(--danger);
    }
    .banner.blocked {
      background: var(--ok-bg);
      border-color: var(--ok-border);
      color: var(--ok);
    }
    .banner.info {
      background: var(--subtle);
      border-color: var(--border-strong);
      color: var(--ink);
    }
    .banner pre {
      margin-top: 8px;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 400;
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--ink-2);
    }
    .probe-bar {
      display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px;
    }
    table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 4px; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; }
    th { color: var(--ink-3); font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.04em; }
    @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand">
        <span class="brand-dot"></span>
        <span>PixelMart</span>
        <span class="badge live" id="dbHashBadge">DB: loading...</span>
      </div>
      <div class="auth-bar">
        <span class="badge" id="userBadge">Not logged in</span>
        <button id="loginAliceBtn" data-testid="login-alice">Login as Alice</button>
        <button id="loginAdminBtn" data-testid="login-admin">Login as Admin</button>
        <button id="logoutBtn" data-testid="logout-btn">Logout</button>
      </div>
    </header>

    <div class="grid">
      <div class="panel">
        <h2>Catalog</h2>
        <div class="products" id="productsGrid"></div>

        <h2 style="margin-top: 20px;">Recent Customer Orders</h2>
        <div id="ordersBox">
          <table>
            <thead>
              <tr><th>Order</th><th>User</th><th>Coupon</th><th>Total</th><th>Status</th></tr>
            </thead>
            <tbody id="ordersTableBody"></tbody>
          </table>
        </div>
      </div>

      <div class="panel">
        <h2>Checkout</h2>
        <div class="cart-list" id="cartList">
          <div class="badge">Cart is empty — add an item</div>
        </div>
        <div class="coupon-row">
          <input id="couponInput" placeholder="Coupon code (e.g. HACKS25)" />
          <button id="applyCouponBtn">Add coupon</button>
        </div>
        <div id="appliedCoupons" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;"></div>
        <div class="totals">
          <div class="total-line"><span>Subtotal</span><strong id="subtotalText">$0.00</strong></div>
          <div class="total-line"><span>Discount</span><strong id="discountText">$0.00</strong></div>
          <div class="total-line total-final"><span>Total Due</span><span id="totalText">$0.00</span></div>
        </div>
        <button class="primary" id="checkoutBtn" style="width:100%;" data-testid="checkout-btn">
          Place order
        </button>

        <div id="resultBanner" class="banner" data-testid="result-banner">
          <div id="bannerTitle"></div>
          <pre id="bannerBody"></pre>
        </div>
      </div>
    </div>

    <div class="panel">
      <h2>Verification Endpoints</h2>
      <div class="probe-bar">
        <button id="probeAdminBtn">Admin ledger (/api/admin/orders)</button>
        <button id="probeIdorBtn">Order #1002 (/api/orders/1002)</button>
        <button id="refreshOrdersBtn">Refresh orders</button>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
