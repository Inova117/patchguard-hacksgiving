<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PixelMart — Hardware &amp; Dev Gear</title>
  <style>
    :root {
      --bg: #0b0e14;
      --card: #121722;
      --card2: #181f2e;
      --border: #253047;
      --text: #eef2ff;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --ok: #10b981;
      --danger: #ef4444;
      --warn: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
      line-height: 1.45;
    }
    .shell { max-width: 1120px; margin: 0 auto; display: grid; gap: 18px; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 18px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; }
    .brand-dot {
      width: 12px; height: 12px; border-radius: 3px;
      background: linear-gradient(135deg, #3b82f6, #06b6d4);
    }
    .auth-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .badge {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      background: var(--card2);
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .badge.live { color: #60a5fa; border-color: #1d4ed8; }
    button {
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--card2);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      transition: background 0.15s;
    }
    button:hover { background: #212b40; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.primary:hover { background: #2563eb; }
    input {
      background: #0d121c;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 13px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1.45fr 1fr;
      gap: 18px;
      align-items: start;
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }
    .panel h2 {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 12px;
    }
    .products { display: grid; gap: 10px; }
    .product-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
    }
    .product-name { font-weight: 700; font-size: 15px; }
    .product-sku { font-size: 12px; color: var(--muted); font-family: monospace; }
    .product-price { font-weight: 800; font-size: 16px; color: #93c5fd; margin-right: 10px; }
    .cart-list { display: grid; gap: 8px; margin-bottom: 12px; font-size: 13px; }
    .cart-item {
      display: flex; justify-content: space-between; align-items: center;
      background: #0d121c; border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 10px;
    }
    .coupon-row { display: flex; gap: 8px; margin-bottom: 10px; }
    .coupon-row input { flex: 1; }
    .totals {
      border-top: 1px solid var(--border);
      padding-top: 10px;
      margin-bottom: 12px;
      display: grid;
      gap: 4px;
      font-size: 13px;
    }
    .total-line { display: flex; justify-content: space-between; }
    .total-final { font-size: 18px; font-weight: 800; color: #fff; margin-top: 4px; }
    .banner {
      display: none;
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      border: 1px solid transparent;
    }
    .banner.show { display: block; }
    .banner.breach {
      background: rgba(239, 68, 68, 0.16);
      border-color: var(--danger);
      color: #fca5a5;
    }
    .banner.blocked {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--ok);
      color: #6ee7b7;
    }
    .banner.info {
      background: rgba(59, 130, 246, 0.15);
      border-color: var(--accent);
      color: #bfdbfe;
    }
    .banner pre {
      margin-top: 8px;
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 11.5px;
      font-weight: 400;
      white-space: pre-wrap;
      word-break: break-word;
      color: #e2e8f0;
    }
    .probe-bar {
      display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px;
    }
    table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 8px; }
    th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-size: 11px; text-transform: uppercase; }
    @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand">
        <span class="brand-dot"></span>
        <span>PixelMart</span>
        <span class="badge live" id="dbHashBadge">DB: loading...</span>
      </div>
      <div class="auth-bar">
        <span class="badge" id="userBadge">Not logged in</span>
        <button id="loginAliceBtn" data-testid="login-alice">Login as Alice (customer)</button>
        <button id="loginAdminBtn" data-testid="login-admin">Login as Admin</button>
        <button id="logoutBtn" data-testid="logout-btn">Logout</button>
      </div>
    </header>

    <div class="grid">
      <div class="panel">
        <h2>Catalog</h2>
        <div class="products" id="productsGrid"></div>

        <h2 style="margin-top: 18px;">Recent Customer Orders</h2>
        <div id="ordersBox">
          <table>
            <thead>
              <tr><th>Order</th><th>User</th><th>Coupon</th><th>Total</th><th>Status</th></tr>
            </thead>
            <tbody id="ordersTableBody"></tbody>
          </table>
        </div>
      </div>

      <div class="panel">
        <h2>Shopping Cart &amp; Checkout</h2>
        <div class="cart-list" id="cartList">
          <div class="badge">Cart is empty — add an item</div>
        </div>
        <div class="coupon-row">
          <input id="couponInput" placeholder="Coupon code (e.g. HACKS25)" />
          <button id="applyCouponBtn">Add Coupon</button>
        </div>
        <div id="appliedCoupons" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;"></div>
        <div class="totals">
          <div class="total-line"><span>Subtotal</span><strong id="subtotalText">$0.00</strong></div>
          <div class="total-line"><span>Discount</span><strong id="discountText">$0.00</strong></div>
          <div class="total-line total-final"><span>Total Due</span><span id="totalText">$0.00</span></div>
        </div>
        <button class="primary" id="checkoutBtn" style="width:100%;" data-testid="checkout-btn">
          Place Order
        </button>

        <div id="resultBanner" class="banner" data-testid="result-banner">
          <div id="bannerTitle"></div>
          <pre id="bannerBody"></pre>
        </div>
      </div>
    </div>

    <div class="panel">
      <h2>Live QA / Security Verification Console</h2>
      <div class="probe-bar">
        <button id="probeAdminBtn">Check Admin Ledger (/api/admin/orders)</button>
        <button id="probeIdorBtn">Check Order #1002 (/api/orders/1002)</button>
        <button id="refreshOrdersBtn">Refresh My Orders</button>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
